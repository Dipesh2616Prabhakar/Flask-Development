{% extends "base.html" %}
{% block content %}
<div class="container mt-4" style="max-width: 600px;">
  <div class="card">
    <div class="card-header">
      <h4 class="mb-0">Employee Details</h4>
    </div>
    <div class="card-body p-4">
      <table class="table table-borderless">
        <tr><th>ID</th><td>{{employee.id}}</td></tr>
        <tr><th>Name</th><td>{{employee.name}}</td></tr>
        <tr><th>Email</th><td>{{employee.email}}</td></tr>
        <tr><th>Salary</th><td>₹{{employee.salary}}</td></tr>
        <tr><th>Department</th><td>{{employee.department}}</td></tr>
      </table>
      <div class="d-flex gap-2 mt-3">
        <a href="/employee/employeeUpdate/{{employee.id}}" class="btn btn-warning">Edit</a>
        <a href="/employee/list" class="btn btn-outline-dark">Go Back</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
